# --------------------------------------------------------
#  HikariCP €” Configuración del Pool de Conexiones
#  Archivo: src/main/resources/hikari.properties
# --------------------------------------------------------

# --€ Identificación del pool -----------------------------
poolName=BibliotecaPool

# --”€ Base de datos (H2 en memoria para desarrollo) -------
# H2 en memoria: ideal para desarrollo y tests
# Para producción cambiar a MySQL/PostgreSQL con el perfil -P produccion
jdbcUrl=jdbc:h2:mem:biblioteca;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
# driverClassName=org.h2.Driver
username=sa
password=

# --”€ Tamaño del pool -------------------------------------
# minimumIdle: conexiones mínimas siempre activas en el pool
minimumIdle=2

# maximumPoolSize: máximo de conexiones simultáneas
# Fórmula recomendada: (núcleos CPU * 2) + spindle disks
# Para desarrollo: 5 es suficiente
maximumPoolSize=5

# --”€ Timeouts (milisegundos) --------------------------------------
# connectionTimeout: tiempo máximo esperando una conexión del pool
connectionTimeout=30000

# idleTimeout: tiempo que una conexión inactiva permanece en el pool
idleTimeout=600000

# maxLifetime: tiempo máximo de vida de una conexión (renovación periódica)
# Debe ser MENOR que el wait_timeout del servidor de base de datos
maxLifetime=1800000

# keepaliveTime: intervalo para enviar ping y mantener la conexión viva
keepaliveTime=60000

# --€ Validación de conexiones -----------------------------------------
# connectionTestQuery: query para verificar que la conexión sigue viva
# Para H2/MySQL/PostgreSQL con JDBC4+ no es necesario (auto-detection)
# connectionTestQuery=SELECT 1

# --”€ Nombre del esquema (opcional) ------------------------------------
# schema=biblioteca

# --”€ Auto-commit -------------------------------------------------------
# autoCommit=true significa que cada statement se confirma automáticamente
# Ponemos false para gestionar transacciones explícitamente
autoCommit=true
