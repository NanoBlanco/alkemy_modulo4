<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Usuarios</title>
</head>
<body>
	<h2>Lista de Usuarios</h2>
	<br>
	<a th:href="@{/usuarios/nuevo}">Nuevo Usuario</a>
	
	<table>
		<thead>
			<tr>
				<th>Id</th>
				<th>Nombre</th>
				<th>Correo</th>
				<th>Roles</th>
				<th>Acciones</th>
			</tr>
		</thead>
		<tbody>
			<tr th:each="u: ${usuarios}">
				<td th:text="${u.id}"></td>
				<td th:text="${u.nombre}"></td>
				<td th:text="${u.correo}"></td>
				<td th:text="${u.roles.nombre}"></td>
				<td>
					<a th:href="@{/usuarios/editar/{id}(id=${u.id})}">Editar</a>
					<a th:href="@{/usuarios/delete/{id}(id=${u.id})}">Eliminar</a>
				</td>
			</tr>
		</tbody>
	</table>
</body>
</html>
