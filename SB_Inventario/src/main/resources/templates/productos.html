<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Inventario</title>
</head>
<body>
	<h2>Productos</h2>
	<br>
	<a th:href="@{/productos/nuevo}">Nuevo Producto</a>
	<br>
	<table>
		<thead>
		<tr>
			<th>Id</th>
			<th>Nombre</th>
			<th>Precio</th>
			<th>Stock</th>
			<th>Categoria</th>
			<th>Activo</th>
			<th>Acciones</th>
		</tr>
		</thead>
		<tbody>
			<tr th:each="p : ${productos}">
				<td th:text="${p.id}"></td>
				<td th:text="${p.nombre}"></td>
				<td th:text="${p.precio}"></td>
				<td th:text="${p.stock}"></td>
				<td th:text="${p.categoria.nombre}"></td>
				<td th:text="${p.activo}"></td>
				<td>
					<a th:href="@{/productos/editar/{id} (id=${p.id})}">Editar</a>
					<a th:href="@{/productos/eliminar/{id} (id=${p.id})}">Eliminar</a>
				</td>
			</tr>
		</tbody>
	</table>
</body>
</html>
