<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
	<head>
		<meta charset="UTF-8">
		<title>Usuarios</title>
		<link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
	</head>
	<body>
	<div th:replace="fragmentos/menu :: menu"></div>
		<section class="container mt-5">
 			<div class="card">
			<div class="card-header">
				<h2>Agregar Usuario</h2>
			</div>
			<div class="card-body">
				<form class="row g-3" th:action="@{/registro}" th:object="${usuario}" method="post">
					<div class="col-md-4">
						<label for="validationCustom01" class="form-label">Username:</label>
						<input type="text" class="form-control" id="validationCustom01" name="username"
							required>
					</div>
					<div class="col-md-12">
						<label for="validationCustom02" class="form-label">Clave</label> 
						<input type="password" class="form-control" id="validationCustom02" name="password"
							required>
					</div>
					
					<div class="col-md-12">
						<label for="validationCustom03" class="form-label">Correo</label> 
						<input type="email" class="form-control" id="validationCustom03" name="email"
							required>
					</div>
					<div class="col-md-12">
						<label for="validationCustom04" class="form-label">Role</label> 
						<select class="form-select" name="role" id="validationCustom04">
							<option value="USER">USER</option>
							<option value="ADMIN">ADMIN</option>
						</select>
					</div>
					<div class="col-12 mt-3">
						<button class="btn btn-primary" type="submit">Grabar</button>
					</div>
				</form>
			</div>
		</div>
 		</section>
		
	</body>
</html>
</html>
