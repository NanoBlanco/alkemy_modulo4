<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Usuario</title>
<link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
	<div th:replace="fragmentos/menu :: menu"></div>
	<section class="container mt-5">
		<div class="card">
			<div class="card-header">
				<h2>Listado de Usuarios</h2>
				<div class="text-right">
					<a th:href="@{/registro}">Nuevo Usuario</a>
				</div>
			</div>
			<div class="card-body">
				<table class="table table-bordered">
					<thead>
						<tr>
							<th scope="col">Usuario</th>
							<th scope="col">Role</th>
							<th scope="col">Correo</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="a:${usuarios}">
							<td th:text="${a.username}"></td>
							<td th:text="${a.role}"></td>
							<td th:text="${a.email}"></td>
							<td>
								<div style="display: flex; justify-content: space-evenly;">
									<form th:action="@{/usuarios/editar/{id}(id=${a.id})}"
										method="get">
										<button type="submit" class="btn btn-danger btn-sm">Editar</button>
									</form>
									<form th:action="@{/usuarios/eliminar/{id}(id=${a.id})}"
										method="post">
										<button type="submit" class="btn btn-danger btn-sm">Eliminar</button>
									</form>
								</div>
							</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
	</section>
	<script src="https://code.jquery.com/jquery-3.4.1.slim.min.js"
		integrity="sha384-J6qa4849blE2+poT4WnyKhv5vZF5SrPo0iEjwBvKU7imGFAV0wwj1yYfoRSJoZ+n"
		crossorigin="anonymous">
		
	</script>
	<script
		src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"
		integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo"
		crossorigin="anonymous">
		
	</script>
	<script
		src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js"
		integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6"
		crossorigin="anonymous">
		
	</script>
</body>
</html>
