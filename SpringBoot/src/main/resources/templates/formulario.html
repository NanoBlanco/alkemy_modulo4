<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Formulario</title>
</head>
<body>
	<h2>Registro de usuarios</h2>
	<div th:if="${mensajeExito}" style="color: green">
		<p th:text="${mensajeExito}"></p>
	</div>
	<form th:action="@{/formulario}" th:object="${usuario}" method="post"> 
		<label>Nombre:</label>
		<input type="text" th:field="*{nombre}" />
		<span style="color:red" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></span>
		<br><br>
		<label>Correo:</label>
		<input type="email" th:field="*{correo}" />
		<span style="color:red" th:if="${#fields.hasErrors('correo')}" th:errors="*{correo}"></span>
		<br>
		<button type="submit">Enviar</button>
	</form>
</body>
</html>
